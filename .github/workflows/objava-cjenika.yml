
name: Objava cjenika proizvoda

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: write

concurrency:
  group: objava-cjenika-proizvoda
  cancel-in-progress: false

jobs:
  objavi:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi datoteke
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generiraj cjenik iz Shopifyja
        env:
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python scripts/generiraj_cjenik.py

      - name: Pripremi aktualni cjenik i arhivu
        run: python scripts/objavi_cjenik.py

      - name: Spremi cjenik i arhivu u repozitorij
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add aktualni-cjenik.csv arhiva.json arhiva/

          git commit -m "Objava cjenika proizvoda" || exit 1

          git push origin HEAD:main
